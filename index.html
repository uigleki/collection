<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta name="text-scale" content="scale" />

        <title>__SITE_TITLE__</title>
        <meta
            name="description"
            content="__SITE_DESCRIPTION__"
        />
        <meta property="og:title" content="__SITE_TITLE__" />
        <meta
            property="og:description"
            content="__SITE_DESCRIPTION__"
        />
        <meta property="og:type" content="website" />
        <meta property="og:image" content="__SITE_ORIGIN__/og.png" />
        <meta property="og:image:width" content="1200" />
        <meta property="og:image:height" content="630" />
        <meta name="twitter:card" content="summary_large_image" />

        <meta name="color-scheme" content="light dark" />
        <meta
            name="theme-color"
            media="(prefers-color-scheme: light)"
            content="__BACKGROUND_LIGHT__"
            data-theme="light"
            data-color="__BACKGROUND_LIGHT__"
        />
        <meta
            name="theme-color"
            media="(prefers-color-scheme: dark)"
            content="__BACKGROUND_DARK__"
            data-theme="dark"
            data-color="__BACKGROUND_DARK__"
        />
        <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
        <link rel="manifest" href="/manifest.webmanifest" />

        <script>
            // Runs before first paint, so a stored choice of theme is never
            // shown in the other theme first. Without a choice the page
            // follows the system theme, in CSS alone.
            try {
                const t = localStorage.getItem("theme");
                if (t === "light" || t === "dark") {
                    document.documentElement.dataset.theme = t;
                    document.querySelector(
                        'meta[name="color-scheme"]',
                    ).content = t;
                    const color = document.querySelector(
                        `meta[name="theme-color"][data-theme="${t}"]`,
                    ).dataset.color;
                    for (const m of document.querySelectorAll(
                        'meta[name="theme-color"]',
                    ))
                        m.content = color;
                }
            } catch {}
        </script>
    </head>
    <body style="__SPRINGS__">
        <div id="root"></div>
        <script type="module" src="/src/app/main.tsx"></script>
    </body>
</html>
