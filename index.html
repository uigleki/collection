<!doctype html>
<html lang="en" data-theme="dark">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />

        <title>__SITE_TITLE__</title>
        <meta
            name="description"
            content="__SITE_DESCRIPTION__"
        />
        <meta property="og:title" content="__SITE_TITLE__" />
        <meta
            property="og:description"
            content="__SITE_DESCRIPTION__"
        />
        <meta property="og:type" content="website" />
        <meta property="og:image" content="__SITE_ORIGIN__/og.png" />
        <meta property="og:image:width" content="1200" />
        <meta property="og:image:height" content="630" />
        <meta name="twitter:card" content="summary_large_image" />

        <meta name="color-scheme" content="dark light" />
        <meta
            name="theme-color"
            content="__GROUND_DUSK__"
            media="(prefers-color-scheme: light)"
        />
        <meta
            name="theme-color"
            content="__GROUND_NIGHT__"
            media="(prefers-color-scheme: dark)"
        />
        <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
        <link rel="manifest" href="/manifest.webmanifest" />

        <script>
            // Theme before paint — deterministic, never a flash.
            try {
                const t = localStorage.getItem("theme");
                document.documentElement.dataset.theme =
                    t === "light" || t === "dark"
                        ? t
                        : matchMedia("(prefers-color-scheme: light)").matches
                          ? "light"
                          : "dark";
            } catch {}
        </script>
    </head>
    <body>
        <div id="root"></div>
        <script type="module" src="/src/app/main.tsx"></script>
    </body>
</html>
